<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garden Route races · Grok Dashboards</title>
  <style>
    :root { color-scheme: dark; --bg:#14120f; --ink:#e8e1d4; --muted:#9a917f; --line:#3a342b; --accent:#d4a017; --card:#1c1914; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 18px/1.55 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: radial-gradient(900px 420px at 90% -10%, #2a2318 0%, transparent 55%), var(--bg);
      color: var(--ink);
    }
    .page { max-width: 40rem; margin: 0 auto; padding: 3.5rem 1.5rem 4rem; }
    .kicker { letter-spacing: .2em; text-transform: uppercase; font-size: .72rem; color: var(--accent); font-family: ui-monospace, "IBM Plex Mono", Menlo, monospace; }
    h1 { font-size: clamp(2rem, 5vw, 2.6rem); font-weight: 600; margin: .4rem 0 1rem; }
    p { color: var(--muted); }
    .panel {
      margin-top: 2rem;
      padding: 1.25rem 1.35rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .panel strong { color: var(--ink); font-weight: 600; }
    a { color: var(--accent); }
    .meta { margin-top: 2rem; font-size: .92rem; }
  </style>
</head>
<body>
  <main class="page">
    <p class="kicker">Grok Dashboards</p>
    <h1>Garden Route race dashboard</h1>
    <p>This subdomain will host the Garden Route race dashboard for the season running September 2026 through February 2027.</p>
    <div class="panel">
      <p><strong>Placeholder only.</strong> Race calendars, results, and maps have not been loaded yet. Nothing here is live event data.</p>
    </div>
    <p class="meta"><a href="https://grok_dashboards.streblainnovations.com/">All dashboards</a></p>
  </main>
</body>
</html>
